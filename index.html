<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry Olympiad Problem Catalog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="app-header-inner">
    <div class="app-header-title">
      <span class="app-eyebrow">Reference catalog</span>
      <h1>Chemistry Olympiad Problem Catalog</h1>
    </div>
    <div class="header-controls">
      <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Switch color theme">
        <button type="button" class="theme-toggle-btn is-active" data-theme="professional" aria-pressed="true">Professional</button>
        <button type="button" class="theme-toggle-btn" data-theme="nebula" aria-pressed="false">Nebula</button>
      </div>
      <div class="view-toggle" id="view-toggle" role="group" aria-label="Switch view">
        <button type="button" class="view-toggle-btn is-active" data-view="table" aria-pressed="true">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M1 2h14v2H1V2Zm0 4.5h14v2H1v-2ZM1 11h14v2H1v-2Z"/></svg>
          Table
        </button>
        <button type="button" class="view-toggle-btn" data-view="board" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M1 1h6v6H1V1Zm8 0h6v6H9V1ZM1 9h6v6H1V9Zm8 0h6v6H9V9Z"/></svg>
          Board
        </button>
      </div>
    </div>
  </div>
</header>

<details class="coverage-section" id="coverage-section" open>
  <summary class="coverage-summary">
    <span class="coverage-summary-title">Catalog Coverage</span>
    <span class="coverage-summary-sub">Click an olympiad to jump straight to its problems</span>
  </summary>
  <div class="coverage-grid" id="coverage-grid"></div>
</details>

<main>
  <section class="filter-bar" id="filter-bar">
    <div class="filter-group">
      <label for="filter-id">ID</label>
      <input type="text" id="filter-id" placeholder="Search ID…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label for="filter-title">Title</label>
      <input type="text" id="filter-title" placeholder="Search title…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label for="filter-nation">Nation</label>
      <select id="filter-nation">
        <option value="">All nations</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-olympiad">Olympiad</label>
      <select id="filter-olympiad">
        <option value="">All olympiads</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-year">Year</label>
      <select id="filter-year">
        <option value="">All years</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-type">Type</label>
      <select id="filter-type">
        <option value="">All types</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Subset</label>
      <div class="multi-select" id="multi-subset">
        <button type="button" class="multi-select-toggle">All subsets</button>
        <div class="multi-select-panel" hidden></div>
      </div>
    </div>
    <div class="filter-group">
      <label for="filter-theme">Theme / Keyword</label>
      <input type="text" id="filter-theme" placeholder="Search keyword…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label>Skills</label>
      <div class="multi-select" id="multi-skills">
        <button type="button" class="multi-select-toggle">All skills</button>
        <div class="multi-select-panel" hidden></div>
      </div>
    </div>
    <div class="filter-group">
      <label>Target Molecule</label>
      <div class="multi-select" id="multi-target_molecules">
        <button type="button" class="multi-select-toggle">All molecules</button>
        <div class="multi-select-panel" hidden></div>
      </div>
    </div>
    <div class="filter-group">
      <button type="button" class="clear-filters-btn" id="clear-filters-btn">Clear all filters</button>
    </div>
  </section>

  <p class="results-count" id="results-count">0 results</p>

  <div class="view-table" id="view-table">
    <div class="table-wrapper">
      <table class="problems-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Nation</th>
            <th>Olympiad</th>
            <th>Year</th>
            <th>Subset</th>
            <th>Theme / Keywords</th>
            <th>Type</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="problems-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="view-board" id="view-board" hidden>
    <div class="board-grid" id="board-grid"></div>
  </div>

  <div class="empty-state" id="empty-state" hidden></div>
</main>
<script src="app.js"></script>
</body>
</html>
